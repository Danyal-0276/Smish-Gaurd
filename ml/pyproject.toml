[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smishguard-ml"
version = "0.1.0"
description = "SmishGuard local inference and reproducible SMS phishing experiments"
requires-python = ">=3.11,<3.14"
dependencies = ["scikit-learn==1.9.1", "joblib==1.6.0", "numpy==2.5.4", "scipy==1.18.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smishguard_ml*"]
